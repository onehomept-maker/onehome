<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | One Home</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face {
  font-family: 'Generica';
  src: url('Generica.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

:root{
  --bg: #f6f1ea;
  --bg-2: #f8f5f0;
  --white: #ffffff;
  --text: #18202a;
  --muted: #667085;
  --line: rgba(24, 32, 42, 0.12);
  --brand: #1f3b5b;
  --brand-dark: #16304a;
  --brand-2: #b79d7a;
  --danger: #b42318;
  --danger-dark: #8f1c13;
  --shadow: 0 12px 40px rgba(19, 31, 46, 0.08);
  --radius: 24px;
  --radius-sm: 16px;
  --container: 1180px;
}

*{
  box-sizing:border-box;
}

body{
  font-family:'Inter', sans-serif;
  margin:0;
  color:var(--text);
  background:linear-gradient(180deg, #f8f5f0 0%, #f5efe8 100%);
}

.admin{
  width:min(calc(100% - 32px), var(--container));
  margin:0 auto;
  padding:48px 0 70px;
}

.admin-top{
  margin-bottom:28px;
}

.admin-kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid rgba(31,59,91,0.12);
  border-radius:999px;
  background:rgba(255,255,255,0.7);
  color:var(--brand);
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-weight:600;
  margin-bottom:18px;
}

h1{
  margin:0 0 10px;
  font-family:'Generica', sans-serif;
  font-size:clamp(36px, 5vw, 58px);
  font-weight:400;
  letter-spacing:4px;
  color:var(--brand);
  line-height:1;
}

.admin-subtitle{
  margin:0;
  max-width:720px;
  color:var(--muted);
  font-size:16px;
  line-height:1.7;
}

.card{
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.form-card,
.list-card{
  padding:34px;
}

.section-title{
  margin:0 0 8px;
  font-family:'Generica', sans-serif;
  font-size:28px;
  font-weight:400;
  letter-spacing:2px;
  color:var(--brand);
  line-height:1.1;
}

.section-text{
  margin:0 0 28px;
  color:var(--muted);
  font-size:15px;
  line-height:1.7;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.full{
  grid-column:1 / -1;
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:8px;
  color:var(--text);
  letter-spacing:0.01em;
}

input,
textarea,
select{
  width:100%;
  min-height:54px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  font-family:'Inter', sans-serif;
  font-size:14px;
  color:var(--text);
  outline:none;
  transition:border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

textarea{
  min-height:150px;
  padding:16px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:rgba(31,59,91,0.45);
  box-shadow:0 0 0 4px rgba(31,59,91,0.08);
}

input[type="file"]{
  min-height:auto;
  padding:14px 16px;
  background:#fff;
  border:1px dashed rgba(31,59,91,0.22);
}

.actions-row{
  margin-top:28px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

button{
  appearance:none;
  border:none;
  border-radius:999px;
  padding:15px 24px;
  background:var(--brand);
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  font-family:'Inter', sans-serif;
  transition:transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}

button:hover{
  background:var(--brand-dark);
  transform:translateY(-1px);
}

#resultado{
  margin-top:22px;
  background:linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(252,250,247,0.96) 100%);
  padding:18px 20px;
  border-radius:18px;
  border:1px solid rgba(24,32,42,0.08);
  color:var(--muted);
  min-height:58px;
}

.admin-divider{
  height:1px;
  background:rgba(24,32,42,0.08);
  margin:34px 0;
}

#lista-imoveis-admin{
  margin-top:10px;
  display:grid;
  gap:14px;
}

.item-admin{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  padding:18px 20px;
  background:#fff;
  border:1px solid rgba(24,32,42,0.08);
  border-radius:18px;
}

.item-admin span{
  font-size:15px;
  color:var(--text);
  font-weight:500;
}

.item-admin div{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.item-admin button{
  margin-top:0;
  padding:10px 16px;
  font-size:13px;
}

.item-admin button:last-child{
  background:#fff;
  color:var(--text);
  border:1px solid rgba(24,32,42,0.12);
}

.item-admin button:last-child:hover{
  background:#f7f7f7;
}

.lista-imagens-admin{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:16px;
  margin-top:12px;
}

.foto-admin{
  background:#fff;
  border:1px solid rgba(24,32,42,0.08);
  border-radius:18px;
  overflow:hidden;
  cursor:grab;
  box-shadow:0 6px 20px rgba(19,31,46,0.04);
  transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
}

.foto-admin:active{
  cursor:grabbing;
}

.foto-admin.dragging{
  opacity:0.45;
  transform:scale(0.97);
  box-shadow:0 16px 36px rgba(19,31,46,0.12);
  border-color:rgba(31,59,91,0.35);
}

.foto-admin.drag-over{
  transform:translateY(-4px);
  border-color:rgba(31,59,91,0.45);
  box-shadow:0 18px 40px rgba(31,59,91,0.12);
}

.foto-admin img{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
}

.foto-admin-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
}

.foto-admin-numero{
  font-size:13px;
  color:var(--muted);
}

.foto-admin-apagar{
  margin-top:0;
  padding:8px 12px;
  background:var(--danger);
  border:none;
  border-radius:999px;
  color:white;
  font-size:12px;
  cursor:pointer;
}

.foto-admin-apagar:hover{
  background:var(--danger-dark);
}

@media (max-width: 980px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .lista-imagens-admin{
    grid-template-columns:repeat(2, 1fr);
  }
}

@media (max-width: 640px){
  .admin{
    padding:28px 0 50px;
  }

  .form-card,
  .list-card{
    padding:22px;
    border-radius:22px;
  }

  .lista-imagens-admin{
    grid-template-columns:1fr;
  }

  .item-admin{
    flex-direction:column;
    align-items:flex-start;
  }

  .item-admin div{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="admin">

  <div class="admin-top">
    <div class="admin-kicker">Admin • One Home</div>
    <h1>Gerir Imóveis</h1>
    <p class="admin-subtitle">
      Introduza, edite e organize os imóveis da One Home.
    </p>
  </div>

  <div class="card form-card">
    <h2 class="section-title">Criar / editar imóvel</h2>
    <p class="section-text">
      Preencha os dados do imóvel, adicione fotografias e guarde.
    </p>

    <div class="form-grid">

      <div>
        <label>Título</label>
        <input id="titulo">
      </div>

      <div>
        <label>Slug</label>
        <input id="slug">
      </div>

      <div>
        <label>Localização</label>
        <input id="local">
      </div>

      <div>
        <label>Preço</label>
        <input id="preco" inputmode="numeric" placeholder="Ex.: 450 000 €">
      </div>

      <div>
        <label>Estado</label>
        <select id="estado">
          <option value="disponivel">Disponível</option>
          <option value="reservado">Reservado</option>
          <option value="vendido">Vendido</option>
          <option value="arrendado">Arrendado</option>
        </select>
      </div>

      <div>
        <label>Tipologia</label>
        <input id="tipologia">
      </div>

      <div>
        <label>Quartos</label>
        <input id="quartos">
      </div>

      <div>
        <label>WC</label>
        <input id="wc">
      </div>

      <div>
        <label>Área Bruta</label>
        <input id="area_bruta">
      </div>

      <div>
        <label>Área Útil</label>
        <input id="area_util">
      </div>

      <div>
        <label>Classe energética</label>
        <select id="categoria_energetica">
          <option value="">Selecionar</option>
          <option>A+</option>
          <option>A</option>
          <option>B</option>
          <option>B-</option>
          <option>C</option>
          <option>D</option>
          <option>E</option>
          <option>F</option>
          <option>G</option>
        </select>
      </div>

      <div class="full">
        <label>Adicionar novas fotos</label>
        <input type="file" id="imagens" multiple>
      </div>

      <div class="full">
        <label>Fotografias atuais</label>
        <div id="lista-imagens-admin" class="lista-imagens-admin"></div>
      </div>

      <div class="full">
        <label>Descrição</label>
        <textarea id="descricao"></textarea>
      </div>

    </div>

    <div class="actions-row">
      <button id="botaoGuardar" onclick="gerarJSON()">Guardar imóvel</button>
    </div>

    <div id="resultado"></div>
  </div>

  <div class="admin-divider"></div>

  <div class="card list-card">
    <h2 class="section-title">Imóveis existentes</h2>
    <p class="section-text">
      Edite ou apague imóveis já criados.
    </p>

    <div id="lista-imoveis-admin"></div>
  </div>

  <script>

const supabaseUrl = "https://skznafnlkretulgzklue.supabase.co"
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrem5hZm5sa3JldHVsZ3prbHVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTkyMzYsImV4cCI6MjA4ODk3NTIzNn0.2Qf6Qo9xwrtWyL15SBOGtuVDVI-EEIornO0WTVsg4I8"

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

let imagensExistentes = []
let novasImagens = []
let dragIndex = null
let imovelEditando = null

    function limparPreco(valor){
  return String(valor || "")
    .replace(/[^\d]/g, "")
}

function formatarPrecoInput(valor){
  const numeros = limparPreco(valor)
  if (!numeros) return ""

  return new Intl.NumberFormat("pt-PT").format(Number(numeros)) + " €"
}

function renderizarImagensAdmin(){

const container = document.getElementById("lista-imagens-admin")
container.innerHTML = ""

const todasImagens = [
  ...imagensExistentes.map(url => ({ tipo: "existente", url })),
  ...novasImagens.map(item => ({ tipo: "nova", file: item.file, preview: item.preview }))
]

todasImagens.forEach((imagem, index) => {

  const div = document.createElement("div")
  div.className = "foto-admin"
  div.draggable = true
  div.setAttribute("title", "Arraste para mudar a posição")

  const src = imagem.tipo === "existente" ? imagem.url : imagem.preview
  const etiqueta = imagem.tipo === "existente" ? `Posição ${index + 1}` : `Nova • posição ${index + 1}`

  div.innerHTML = `
    <img src="${src}">
    <div class="foto-admin-info">
      <span class="foto-admin-numero">${etiqueta}</span>
      <button type="button" class="foto-admin-apagar" onclick="apagarImagemAdmin(${index})">Apagar</button>
    </div>
  `

  div.addEventListener("dragstart", () => {
    dragIndex = index
    div.classList.add("dragging")
  })

  div.addEventListener("dragend", () => {
    div.classList.remove("dragging")
    document.querySelectorAll(".foto-admin").forEach(item => {
      item.classList.remove("drag-over")
    })
  })

  div.addEventListener("dragover", (e) => {
    e.preventDefault()
    if (dragIndex !== index) {
      div.classList.add("drag-over")
    }
  })

  div.addEventListener("dragleave", () => {
    div.classList.remove("drag-over")
  })

  div.addEventListener("drop", () => {
    div.classList.remove("drag-over")

    if (dragIndex === null || dragIndex === index) return

    const listaCompleta = [
      ...imagensExistentes.map(url => ({ tipo: "existente", url })),
      ...novasImagens.map(item => ({ tipo: "nova", file: item.file, preview: item.preview }))
    ]

    const itemMovido = listaCompleta[dragIndex]
    listaCompleta.splice(dragIndex, 1)
    listaCompleta.splice(index, 0, itemMovido)

    imagensExistentes = listaCompleta
      .filter(item => item.tipo === "existente")
      .map(item => item.url)

    novasImagens = listaCompleta
      .filter(item => item.tipo === "nova")
      .map(item => ({ file: item.file, preview: item.preview }))

    dragIndex = null
    renderizarImagensAdmin()
  })

  container.appendChild(div)
})

}

async function apagarImagemAdmin(index){

const listaCompleta = [
  ...imagensExistentes.map(url => ({ tipo: "existente", url })),
  ...novasImagens.map(item => ({ tipo: "nova", file: item.file, preview: item.preview }))
]

const imagem = listaCompleta[index]
if (!imagem) return

if (imagem.tipo === "nova") {
  novasImagens = listaCompleta
    .filter((_, i) => i !== index && listaCompleta[i].tipo === "nova")
    .map(item => ({ file: item.file, preview: item.preview }))

  imagensExistentes = listaCompleta
    .filter((_, i) => i !== index && listaCompleta[i].tipo === "existente")
    .map(item => item.url)

  renderizarImagensAdmin()
  return
}

if (!confirm("Apagar esta fotografia?")) return

const url = imagem.url
const filePath = url.split("/").pop()

console.log("A apagar:", filePath)

const { error } = await supabaseClient
  .storage
  .from("imoveis")
  .remove([filePath])

if (error) {
  alert("Erro ao apagar no Supabase")
  console.log(error)
  return
}

imagensExistentes = listaCompleta
  .filter((_, i) => i !== index && listaCompleta[i].tipo === "existente")
  .map(item => item.url)

novasImagens = listaCompleta
  .filter((_, i) => i !== index && listaCompleta[i].tipo === "nova")
  .map(item => ({ file: item.file, preview: item.preview }))

renderizarImagensAdmin()

}

async function gerarJSON(){

const resultado = document.getElementById("resultado")
resultado.innerHTML = "A guardar imóvel..."

const tituloEl = document.getElementById("titulo")
const slugEl = document.getElementById("slug")
const localEl = document.getElementById("local")
const precoEl = document.getElementById("preco")
const estadoEl = document.getElementById("estado")
const tipologiaEl = document.getElementById("tipologia")
const quartosEl = document.getElementById("quartos")
const wcEl = document.getElementById("wc")
const areaBrutaEl = document.getElementById("area_bruta")
const areaUtilEl = document.getElementById("area_util")
const categoriaEnergeticaEl = document.getElementById("categoria_energetica")
const descricaoEl = document.getElementById("descricao")
let imagensFinais = []

for (const url of imagensExistentes) {
  imagensFinais.push(url)
}

for (const item of novasImagens) {

  const fileName = `${Date.now()}-${item.file.name}`

  const { error: uploadError } = await supabaseClient.storage
    .from("imoveis")
    .upload(fileName, item.file)

  if (uploadError) {
    console.log(uploadError)
    resultado.innerHTML = "Erro ao carregar uma das imagens."
    return
  }

  const { data } = supabaseClient.storage
    .from("imoveis")
    .getPublicUrl(fileName)

  imagensFinais.push(data.publicUrl)
}
const novoImovel = {
  titulo: tituloEl.value,
  slug: slugEl.value,
  local: localEl.value,
  preco: formatarPrecoInput(precoEl.value),
  estado: estadoEl.value,
  tipologia: tipologiaEl.value,
  quartos: quartosEl.value,
  wc: wcEl.value,
  area_bruta: areaBrutaEl.value,
  area_util: areaUtilEl.value,
  categoria_energetica: categoriaEnergeticaEl.value,
  descricao: descricaoEl.value,
  imagens: imagensFinais
}

let error

if (imovelEditando) {
  const resposta = await supabaseClient
    .from("imoveis")
    .update(novoImovel)
    .eq("id", imovelEditando)

  error = resposta.error
} else {
  const resposta = await supabaseClient
    .from("imoveis")
    .insert([novoImovel])

  error = resposta.error
}

if (error) {
  console.log(error)
  resultado.innerHTML = `Erro ao guardar: ${error.message}`
  return
}

resultado.innerHTML = "Imóvel guardado com sucesso."

imovelEditando = null
imagensExistentes = []
novasImagens = []
renderizarImagensAdmin()

tituloEl.value = ""
slugEl.value = ""
localEl.value = ""
precoEl.value = ""
estadoEl.value = "disponivel"
tipologiaEl.value = ""
quartosEl.value = ""
wcEl.value = ""
areaBrutaEl.value = ""
areaUtilEl.value = ""
categoriaEnergeticaEl.value = ""
descricaoEl.value = ""
imagensInput.value = ""

document.getElementById("botaoGuardar").innerText = "Guardar imóvel"

carregarListaAdmin()

}

async function carregarListaAdmin(){

const {data}=await supabaseClient
.from("imoveis")
.select("*")
.order("id",{ascending:false})

const container=document.getElementById("lista-imoveis-admin")

container.innerHTML=""

data.forEach(imovel=>{

const div=document.createElement("div")
div.className="item-admin"

div.innerHTML=`
<span>${imovel.titulo}</span>
<div>
<button onclick="editarImovel('${imovel.id}')">Editar</button>
<button onclick="apagarImovel('${imovel.id}')">Apagar</button>
</div>
`

container.appendChild(div)

})

}

async function editarImovel(id){

const {data}=await supabaseClient
.from("imoveis")
.select("*")
.eq("id",id)
.single()

titulo.value=data.titulo
slug.value=data.slug
local.value=data.local
preco.value = formatarPrecoInput(data.preco)
estado.value=data.estado
descricao.value=data.descricao

tipologia.value=data.tipologia||""
quartos.value=data.quartos||""
wc.value=data.wc||""
area_bruta.value=data.area_bruta||""
area_util.value=data.area_util||""
categoria_energetica.value=data.categoria_energetica||""

imagensExistentes = data.imagens || []
novasImagens = []

renderizarImagensAdmin()

imovelEditando=id

document.getElementById("botaoGuardar").innerText="Atualizar imóvel"

}

async function apagarImovel(id){

if(!confirm("Apagar imóvel?")) return

await supabaseClient
.from("imoveis")
.delete()
.eq("id",id)

carregarListaAdmin()

}

titulo.addEventListener("input",function(){

const s=this.value
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[^a-z0-9\s-]/g,"")
.trim()
.replace(/\s+/g,"-")

slug.value=s

})

    preco.addEventListener("input", function () {
  this.value = formatarPrecoInput(this.value)
})

    document.getElementById("imagens").addEventListener("change", function () {

const ficheiros = Array.from(this.files)

ficheiros.forEach(file => {
  novasImagens.push({
    file,
    preview: URL.createObjectURL(file)
  })
})

this.value = ""
renderizarImagensAdmin()

})

carregarListaAdmin()

  </script>

</div>
</body>
</html>
